name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy-files:
    # B10: файлы деплоя — синтаксис скриптов, сборка compose «по-серверному», конфиг Caddy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh deploy/edge/*.sh
      - name: compose для сервера собирается
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f deploy/compose.server.yml config -q
          docker compose -f docker-compose.yml config -q
      - name: Caddyfile общего Caddy валиден
        working-directory: deploy/edge
        run: |
          printf 'ACME_EMAIL=ci@example.com\nPROD_DOMAIN=example.com\nSTAGING_DOMAIN=staging.example.com\n' > .env
          RENDER_ONLY=1 bash render-sites.sh
          docker run --rm -e ACME_EMAIL=ci@example.com -v "$PWD:/etc/caddy:ro" caddy:2.9-alpine \
            caddy validate --config /etc/caddy/Caddyfile
