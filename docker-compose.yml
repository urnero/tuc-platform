services:
  caddy:
    image: caddy:2.9-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"

  api:
    build: ./api
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./config:/srv/config:ro
      - ./profiles:/srv/profiles:ro
      - ./catalog:/srv/catalog:ro   # каталог готовых моделей (B20): catalog.yaml + models/
      - ./secrets:/srv/secrets:ro  # ключ Google (B11): secrets/google-sa.json, в git не попадает
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    # фоновые задачи: слайсинг (PrusaSlicer), ночной экспорт в Google-таблицу (B11), позже рендер
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./config:/srv/config:ro
      - ./profiles:/srv/profiles:ro
      - ./secrets:/srv/secrets:ro
    depends_on:
      redis:
        condition: service_started

  bot:
    # Telegram-бот владельца (B07): тот же код, что api, команда другая. Long polling,
    # публичный адрес не нужен. Без TELEGRAM_BOT_TOKEN в .env пишет ошибку и выходит.
    build: ./api
    command: python -m app.bot
    env_file: .env
    environment:
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
