services:
  caddy:
    image: caddy:2.9-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"

  api:
    build: ./api
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./config:/srv/config:ro
      - ./profiles:/srv/profiles:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    # фоновые задачи: слайсинг (PrusaSlicer), позже рендер и экспорт
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./config:/srv/config:ro
      - ./profiles:/srv/profiles:ro
    depends_on:
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
