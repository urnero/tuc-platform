# Цены и ставки для расчёта стоимости печати.
# Числа — ОЦЕНКА ПО РЫНКУ Москвы, октябрь 2026 (B45). Откуда каждое число — таблицы
# в docs/DECISIONS.md (запись 2026-10-29 «Цены B45»). Владелец правит числа под свою
# закупку и аренду; формула от этого не меняется. После правки — перезапустить api.
# Формула (docs/SPEC.md, раздел 4):
#   price = max(min_order,
#               (material_g * price_per_g[material] + print_h * machine_rate[tech])
#               * k_supports * k_batch(qty) * (1 + margin))
#           + postprocess + delivery

currency: RUB
min_order: 400          # минимальная сумма заказа, ₽ — ~30 мин работы: файл, снять, упаковать, выдать
margin: 0.40            # наценка сверху на материал и час принтера, доля
k_supports: 1.15        # коэффициент, если нужны поддержки (удаление и зачистка — ручная работа)

# ₽ за грамм = закупка катушки ₽/кг / 1000 × запас на брак и отходы (1,15; капризные — 1,25)
#              + надбавка за сложность (сушка, закрытая камера, износ сопла от карбона).
# Это ещё БЕЗ наценки margin. Список и описания материалов — config/materials.yaml.
materials:
  PLA:     { price_per_g: 2.3,  tech: FDM }   # закупка ~2 000 ₽/кг
  PETG:    { price_per_g: 2.0,  tech: FDM }   # ~1 550 ₽/кг, +0,2 — тянет нити, печать медленнее
  ABS:     { price_per_g: 2.9,  tech: FDM }   # ~1 550 ₽/кг, отходы 1,25, +1,0 — закрытая камера, усадка
  TPU:     { price_per_g: 4.2,  tech: FDM }   # ~2 800 ₽/кг, +1,0 — сушка, подача мимо AMS
  PA:      { price_per_g: 9.5,  tech: FDM }   # ~6 000 ₽/кг, отходы 1,25, +2,0 — обязательная сушка
  PC:      { price_per_g: 5.6,  tech: FDM }   # ~2 870 ₽/кг, отходы 1,25, +2,0 — камера, сушка, коробление
  PETG-CF: { price_per_g: 4.0,  tech: FDM }   # ~2 020 ₽/кг, отходы 1,25, +1,5 — закалённое сопло
  PA-CF:   { price_per_g: 10.0, tech: FDM }   # ~5 600 ₽/кг, отходы 1,25, +3,0 — сушка + закалённое сопло
  # Смолы (SLA) сюда не пишем: цена по запросу (config/materials.yaml, tech: SLA).

technologies:            # ₽ за час работы принтера (амортизация + свет + обслуживание + доля аренды и оператора)
  FDM: { machine_rate: 70 }

batch:                   # скидка за тираж: от qty → коэффициент
  - { from: 1,   k: 1.00 }
  - { from: 10,  k: 0.90 }
  - { from: 50,  k: 0.80 }
  - { from: 200, k: 0.75 }

postprocess:             # ₽ за изделие (для деталей до ~15 см; крупнее — пересчитываем вручную)
  none: 0
  sanding: 300           # шлифовка: убрать слои и следы поддержек
  painting: 900          # грунт + покраска в один цвет

delivery:                # ₽ за заказ
  pickup: 0
  courier_moscow: 450    # курьер по Москве в пределах МКАД, день в день / на следующий день
  cdek: 500              # СДЭК до пункта выдачи по России — средний тариф посылки до 1 кг
