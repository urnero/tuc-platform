# Справочник материалов (B44). Его читают API (/api/v1/materials) и сайт: карточки на главной,
# подсказки под выбором материала, проверка размера модели.
#
# Как добавить FDM-материал:
#   1) строка здесь (ключ — латиницей, как имя профиля);
#   2) профиль слайсера profiles/filament/<КЛЮЧ>.ini;
#   3) цена за грамм в config/pricing.yaml → materials.
#   Тест api/tests/test_materials.py проверит, что все три места согласованы.
# Убрать материал с сайта — `enabled: false` (строку можно не удалять).
#
# Поля:
#   tech            FDM — считаем слайсером и формулой цены; SLA — «по запросу» (цену подтверждает
#                   владелец, оплата на сайте не предлагается; DECISIONS 2026-10-27 п. 3)
#   name            название для клиента
#   tagline         коротко, 2–4 слова (карточка на главной)
#   hint            когда брать (подсказка под выбором материала)
#   pros / cons     плюсы и минусы
#   uses            где применять
#   colors          цвета в наличии (владелец правит под свою полку)
#   heat_c          до какой температуры держит форму, °C (примерно)
#   needs_enclosure нужна закрытая камера (печатаем только на P1S / Q1 Pro, см. docs/PRINTERS.md)
#   max_mm          наибольшая деталь X×Y×Z, мм — по принтерам, которые печатают этот материал

materials:
  PLA:
    tech: FDM
    name: PLA
    tagline: точный и недорогой
    hint: "Для фигурок, макетов, декора и прототипов. Самый доступный, ровная поверхность. Боится жары: размягчается от 55 °C (машина летом, батарея)."
    pros: [самый доступный, точные мелкие детали, много цветов]
    cons: [мягчеет от 55 °C, хрупкий на удар]
    uses: [макеты, фигурки, декор, прототипы, корпуса для дома]
    colors: [белый, чёрный, серый, красный, синий, жёлтый, зелёный, оранжевый]
    heat_c: 55
    needs_enclosure: false
    max_mm: [256, 256, 256]
    enabled: true

  PETG:
    tech: FDM
    name: PETG
    tagline: прочный, терпит влагу
    hint: "Для деталей, которые работают: крепления, корпуса, кухня и улица. Прочнее и гибче PLA, не боится воды, держит до 70 °C."
    pros: [прочнее PLA, не боится воды, гнётся, а не ломается]
    cons: [поверхность чуть менее ровная, тонкие «волоски» на деталях]
    uses: [крепления, кронштейны, ёмкости, детали для улицы]
    colors: [прозрачный, белый, чёрный, серый, синий]
    heat_c: 70
    needs_enclosure: false
    max_mm: [256, 256, 256]
    enabled: true

  ABS:
    tech: FDM
    name: ABS
    tagline: ударопрочный, до 90 °C
    hint: "Для техники и авто: держит до 90–100 °C, можно шлифовать и склеивать. Детали чуть менее точные, чем из PLA."
    pros: [держит жару, ударопрочный, шлифуется и клеится]
    cons: [усадка на крупных деталях, нужен закрытый принтер]
    uses: [детали авто и техники, корпуса электроники, крепёж под нагревом]
    colors: [белый, чёрный, серый]
    heat_c: 95
    needs_enclosure: true
    max_mm: [256, 256, 256]
    enabled: true

  TPU:
    tech: FDM
    name: TPU (95A)
    tagline: гибкий, как резина
    hint: "Гибкий, как резина: прокладки, чехлы, амортизаторы, ремешки. Печатается медленнее — дороже по времени."
    pros: [гнётся и тянется, гасит удары, износостойкий]
    cons: [печатается медленно, мелкие детали — неточно]
    uses: [прокладки, уплотнители, чехлы, ножки, амортизаторы]
    colors: [чёрный, белый, прозрачный]
    heat_c: 60
    needs_enclosure: false
    max_mm: [250, 250, 250]
    enabled: true

  PA:
    tech: FDM
    name: PA (нейлон)
    tagline: износостойкий, скользкий
    hint: "Нейлон: износостойкий и прочный — шестерни, втулки, петли. Держит до 100 °C."
    pros: [очень износостойкий, прочный на излом, держит до 100 °C]
    cons: [впитывает влагу, нужна закрытая камера, дороже PETG]
    uses: [шестерни, втулки, петли, защёлки, трущиеся детали]
    colors: [натуральный, чёрный]
    heat_c: 100
    needs_enclosure: true
    max_mm: [256, 256, 256]
    enabled: true

  PC:
    tech: FDM
    name: PC (поликарбонат)
    tagline: самый прочный, до 110 °C
    hint: "Поликарбонат: самый прочный и термостойкий из обычных пластиков (до 110 °C) — корпуса, крепёж под нагрузкой."
    pros: [очень прочный, держит до 110 °C, бывает прозрачным]
    cons: [печатается только в закрытой камере, дороже]
    uses: [нагруженные кронштейны, корпуса, детали рядом с мотором]
    colors: [прозрачный, чёрный]
    heat_c: 110
    needs_enclosure: true
    max_mm: [256, 256, 256]
    enabled: true

  PETG-CF:
    tech: FDM
    name: PETG-CF (с углеволокном)
    tagline: жёсткий, матовый
    hint: "PETG с углеволокном: жёсткий, матовый, точно держит размеры — кронштейны, корпуса, оснастка."
    pros: [жёсткий, точный размер, красивая матовая поверхность]
    cons: [хрупче обычного PETG на изгиб, только тёмные цвета]
    uses: [кронштейны, оснастка, корпуса, детали дронов]
    colors: [чёрный]
    heat_c: 75
    needs_enclosure: false
    max_mm: [256, 256, 256]
    enabled: true

  PA-CF:
    tech: FDM
    name: PA-CF (нейлон с углеволокном)
    tagline: инженерный, вместо металла
    hint: "Нейлон с углеволокном: самый жёсткий и прочный из наших пластиков — нагруженные детали вместо металла."
    pros: [жёсткий и прочный, держит до 150 °C, стабильный размер]
    cons: [самый дорогой, только чёрный, нужна закрытая камера]
    uses: [нагруженные кронштейны, оснастка, детали станков и техники]
    colors: [чёрный]
    heat_c: 150
    needs_enclosure: true
    max_mm: [256, 256, 256]
    enabled: true

  # --- Смолы (SLA, Anycubic Photon Mono M5): цена — по запросу ---

  RESIN:
    tech: SLA
    name: Смола стандартная
    tagline: максимум деталей
    hint: "Фотополимерная смола: очень мелкие детали и гладкая поверхность — миниатюры, ювелирные мастер-модели. Хрупкая."
    pros: [мельчайшие детали, гладкая поверхность без слоёв]
    cons: [хрупкая, боится солнца, небольшой размер]
    uses: [миниатюры, фигурки, ювелирные модели, стоматологические макеты]
    colors: [серый, белый, прозрачный]
    heat_c: 50
    needs_enclosure: false
    max_mm: [218, 123, 200]
    enabled: true

  RESIN-TOUGH:
    tech: SLA
    name: Смола прочная (tough / ABS-like)
    tagline: детализация + прочность
    hint: "Прочная смола: детализация смолы, но не колется — защёлки, корпуса малых приборов, функциональные мелкие детали."
    pros: [не хрупкая, мелкие детали, гладкая поверхность]
    cons: [дороже стандартной, небольшой размер]
    uses: [защёлки, мелкие корпуса, функциональные прототипы]
    colors: [серый, чёрный]
    heat_c: 60
    needs_enclosure: false
    max_mm: [218, 123, 200]
    enabled: true

  RESIN-NYLON:
    tech: SLA
    name: Смола нейлоноподобная
    tagline: гибкая и упругая
    hint: "Нейлоноподобная смола: упругая и износостойкая, гнётся без трещин — шарниры, клипсы, мелкие механизмы."
    pros: [упругая, износостойкая, гладкая поверхность]
    cons: [самая дорогая из смол, небольшой размер]
    uses: [клипсы, шарниры, мелкие механизмы]
    colors: [белый, чёрный]
    heat_c: 60
    needs_enclosure: false
    max_mm: [218, 123, 200]
    enabled: true
