# Цвета пластика для раскраски модели по частям (B31).
# Клиент видит эти цвета в блоке «Раскраска по частям» и выбирает по одному на каждую деталь.
# Владелец правит список под то, что реально есть на полке: убрать строку — цвет пропадёт
# с сайта; добавить — появится. После правки перезапустить api.
#
# key  — короткий латинский код (попадает в 3MF и в сводку заказа), менять у готовых цветов не надо;
# name — как показываем клиенту;
# hex  — цвет для 3D-просмотра и для файла 3MF (#RRGGBB).

colors:
  - { key: white,  name: Белый,      hex: "#F2F2F2" }
  - { key: black,  name: Чёрный,     hex: "#2B2B2B" }
  - { key: gray,   name: Серый,      hex: "#8E8E8E" }
  - { key: red,    name: Красный,    hex: "#D32F2F" }
  - { key: orange, name: Оранжевый,  hex: "#F57C00" }
  - { key: yellow, name: Жёлтый,     hex: "#FBC02D" }
  - { key: green,  name: Зелёный,    hex: "#388E3C" }
  - { key: blue,   name: Синий,      hex: "#1976D2" }
  - { key: purple, name: Фиолетовый, hex: "#7B1FA2" }
