# TPU 95A (гибкий), 1.75 мм. Значения — по профилю PrusaSlicer «Generic FLEX».
# Ограничение объёма в секунду замедляет печать — гибкий пруток нельзя гнать быстро,
# поэтому время печати (и цена за часы) у TPU выше, чем у PLA той же модели.
filament_type = FLEX
filament_diameter = 1.75
filament_density = 1.21
filament_cost = 0
extrusion_multiplier = 1
filament_max_volumetric_speed = 3.5
temperature = 230
first_layer_temperature = 235
bed_temperature = 50
first_layer_bed_temperature = 50
cooling = 1
min_fan_speed = 50
max_fan_speed = 80
