# Профиль принтера для PrusaSlicer CLI. Загружается первым (см. api/app/slicer.py).
# Стол 250×210×220 мм — как PRINT_BED_MM в .env.example. Поменял стол — поменяй и тут.
# Это обобщённый FDM-принтер с соплом 0.4. Владелец может заменить файл экспортом
# своего профиля из PrusaSlicer (Файл → Экспорт → Экспорт конфигурации).
printer_technology = FFF
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
nozzle_diameter = 0.4
extruder_offset = 0x0
gcode_flavor = marlin2
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 35
deretract_speed = 0
retract_lift = 0.2
start_gcode = G28 ; домой\nG1 Z5 F5000
end_gcode = M104 S0 ; выключить сопло\nM140 S0 ; выключить стол\nG28 X0\nM84
