# Профиль принтера для PrusaSlicer CLI. Загружается первым (см. api/app/slicer.py).
# Стол 256×256×256 мм — самый большой FDM-принтер студии (Bambu P1S, docs/PRINTERS.md),
# как PRINT_BED_MM в .env.example. Меньшие области у отдельных материалов — поле max_mm
# в config/materials.yaml: сайт проверяет его до расчёта. Тест tests/test_print_area.py
# следит, чтобы любой max_mm помещался в этот стол. Центр стола для --center api берёт отсюда.
# Это обобщённый FDM-принтер с соплом 0.4. Владелец может заменить файл экспортом
# своего профиля из PrusaSlicer (Файл → Экспорт → Экспорт конфигурации).
printer_technology = FFF
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
extruder_offset = 0x0
gcode_flavor = marlin2
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 35
deretract_speed = 0
retract_lift = 0.2
start_gcode = G28 ; домой\nG1 Z5 F5000
end_gcode = M104 S0 ; выключить сопло\nM140 S0 ; выключить стол\nG28 X0\nM84
