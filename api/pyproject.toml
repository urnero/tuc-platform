[project]
name = "tuc-api"
version = "0.1.0"
description = "API платформы ТУЦ: расчёт цены, заказы, оплата, учёт"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.9,<1",
    "trimesh>=4.5,<6",
    "manifold3d>=3.0,<4",  # булевы операции (объединить/вырезать) для тиснения (B30)
    "numpy>=1.26,<3",
    "lxml>=5,<7",
    "networkx>=3,<4",
    "arq>=0.26,<1",
    "redis>=5,<6",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "aiogram>=3.13,<4",
    "jinja2>=3.1,<4",
    "pyjwt[crypto]>=2.8,<3",
    "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "scad/*.scad"]  # шаблоны админки (B09) и scad тиснения (B30)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
