# Редактор «Втулка / проставка» (B21) — пример и образец формата для остальных редакторов.
#
# Папка editors/<slug>/ = один редактор. slug — имя папки (латиница, цифры, дефис), он же адрес
# страницы /editors/<slug>. В папке: этот файл и model.scad (OpenSCAD). Каждый параметр ниже —
# переменная с тем же именем в начале model.scad; сервер подставляет значения клиента
# ключом `-D имя=значение`. Правки yaml подхватываются без перезапуска.
#
# Поля редактора:
#   title     — название (обязательно);  text — описание под названием;
#   material  — материал по умолчанию в калькуляторе (PLA / PETG / ABS);
#   order     — порядок в списке (меньше — выше); scad — имя файла модели (по умолчанию model.scad).
#
# Параметр (params):
#   name   — имя переменной в scad: a-z, 0-9, «_»;  label — подпись в форме;  hint — подсказка;
#   type   — number | bool | choice | text;
#   number — min, max, step (шаг стрелок; число округляется до знаков шага), unit («мм»),
#            integer: true — только целые;
#   choice — options: список значений или пар {value, label};
#   text   — maxlen (до 200), без переносов строк;
#   default — значение по умолчанию (обязано проходить проверку).
#
# checks — правила между числовыми параметрами: rule вида «inner_d < outer_d» или «height >= 2»
#          (операторы < <= > >=), message — текст ошибки клиенту. Показывается у левого параметра.

title: Втулка / проставка
text: >
  Кольцо или шестигранник с отверстием: проставка под винт, втулка в мебель, дистанционная
  шайба. Задайте диаметры и высоту — модель построится сразу, дальше расчёт и заказ.
material: PETG
order: 10

params:
  - name: outer_d
    label: Внешний диаметр
    type: number
    unit: мм
    min: 4
    max: 200
    step: 0.5
    default: 20
    hint: Для шестигранника — размер «под ключ» (между плоскостями).
  - name: inner_d
    label: Диаметр отверстия
    type: number
    unit: мм
    min: 1
    max: 195
    step: 0.5
    default: 8.5
    hint: Под винт М8 обычно 8,5 мм.
  - name: height
    label: Высота
    type: number
    unit: мм
    min: 1
    max: 150
    step: 0.5
    default: 10
    hint: Длина втулки вдоль отверстия (толщина проставки).
  - name: shape
    label: Форма
    type: choice
    options:
      - { value: round, label: Круглая }
      - { value: hex, label: Шестигранник }
    default: round
    hint: Шестигранник не прокручивается в пазу и удобен под гаечный ключ.
  - name: chamfer
    label: Фаска по краям
    type: bool
    default: true
    hint: Снимает острые кромки сверху и снизу (0,8 мм).

checks:
  - rule: inner_d < outer_d
    message: Отверстие должно быть меньше внешнего диаметра.
